# Build Race Team IQ Wear OS watch app and upload to Google Play by branch.
# - qa branch  → internal testing track (draft)
# - master     → production track (completed)
# Pull requests build a debug APK only (no upload).
# Repo: raceteam-iq-watch (this repo). Set secrets in Settings → Environments → QA / PROD.

name: Build Android (Wear OS)

on:
  push:
    branches: [qa, master]
  pull_request:
    branches: [qa, master]

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
  PACKAGE_NAME: com.raceteamiq.watch
  PROJECT_DIR: android

jobs:
  build-android-watch:
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/qa' || github.base_ref == 'qa') && 'QA' || 'PROD' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT
          curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11391160_latest.zip" -o cmdlinetools.zip
          unzip -q cmdlinetools.zip -d $ANDROID_SDK_ROOT
          mv $ANDROID_SDK_ROOT/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools-latest
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools-latest $ANDROID_SDK_ROOT/cmdline-tools/latest
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          echo "y" | $SDKMANAGER --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "y" | $SDKMANAGER --sdk_root=$ANDROID_SDK_ROOT --licenses || true

      - name: Generate Gradle wrapper (watch app)
        run: |
          cd ${{ env.PROJECT_DIR }}
          curl -sL "https://services.gradle.org/distributions/gradle-8.14.4-bin.zip" -o "${{ github.workspace }}/gradle-8.14.4.zip"
          unzip -q "${{ github.workspace }}/gradle-8.14.4.zip" -d "${{ github.workspace }}"
          "${{ github.workspace }}/gradle-8.14.4/bin/gradle" wrapper --gradle-version 8.14.4
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.4-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          rm -rf "${{ github.workspace }}/gradle-8.14.4" "${{ github.workspace }}/gradle-8.14.4.zip"

      # On PRs: build debug only and upload artifact
      - name: Build Android watch (debug APK)
        if: github.event_name == 'pull_request'
        run: cd ${{ env.PROJECT_DIR }} && ./gradlew assembleDebug
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload debug APK (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: watch-app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      # On push to qa/master: signing and build release AAB
      - name: Decode keystore and create keystore.properties
        if: github.event_name == 'push' && (github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/master')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          printf "storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build Android watch (release AAB)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/master')
        run: cd ${{ env.PROJECT_DIR }} && ./gradlew bundleRelease
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"

      - name: Upload AAB artifact (push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: watch-app-release-${{ github.ref_name }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab

      # Upload to Google Play: qa → internal (draft), master → production
      - name: Upload to Google Play (internal – qa)
        if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_WATCH_SERVICE_ACCOUNT_JSON || secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

      - name: Upload to Google Play (production – master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_WATCH_SERVICE_ACCOUNT_JSON || secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
